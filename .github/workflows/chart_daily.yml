name: Daily BTC Chart

# 매일 09:30 KST(BTC 일봉 마감 30분 뒤)에 chart.py로 차트를 새로 만들어
# 이 저장소의 GitHub Pages에 index.html로 게시한다.
#
# 필요한 설정 (DEPLOY.md 참고)
#   - 무료 계정은 공개(Public) 저장소에서만 Pages를 쓸 수 있다.
#   - Settings → Pages → Source 를 "GitHub Actions"로 바꾼다.

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write     # 아래 '예약 실행 유지' 단계에서만 쓴다
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install numpy pandas scipy requests

      - name: Build chart
        run: python chart.py

      - name: Prepare site
        run: |
          mkdir -p site
          cp data/chart.html site/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # 공개 저장소는 60일 동안 커밋이 없으면 예약 실행이 자동으로 꺼진다.
      # 마지막 커밋이 50일보다 오래되면 빈 커밋을 하나 남겨 예약을 유지한다.
      - name: Keep schedule active
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep daily chart schedule active"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

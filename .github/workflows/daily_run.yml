name: BTC Forecast Pipeline (manual)

# 예측 파이프라인과 텔레그램 브리핑. 자동 실행은 꺼 두었고 필요할 때 Actions 탭에서 수동으로 실행한다.
# 매일 자동으로 도는 것은 chart_daily.yml(차트 게시)이다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn requests matplotlib
      - name: Run pipeline
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: python pipeline.py
      - name: Commit updated forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/latest.json data/dashboard.html data/forecasts.csv data/backtest_results.csv
          git diff --staged --quiet || git commit -m "chore: update BTC forecast"
          git push
